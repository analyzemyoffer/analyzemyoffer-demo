<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AnalyzeMyOffer — Coming Soon</title>
<meta name="description" content="AnalyzeMyOffer — coming soon. Negotiate with confidence. Or sign with clarity." />
<meta name="theme-color" content="#0E1118" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)" />
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Logo colors — locked to the dark variant in Logo.tsx (black bg, white strokes).
     The mark stays the same on either theme so the orange trend pops on either canvas. */
  :root {
    --logo-bg:      #1a1a1a;
    --logo-letter:  #ffffff;
  }

  /* ── Dark theme (default) ────────────────────────────────────────── */
  :root,
  [data-theme="dark"] {
    --ed-bg:        oklch(0.165 0.020 250);
    --ed-fg:        oklch(0.940 0.010 245);
    --ed-fg-muted:  oklch(0.720 0.012 245);
    --ed-fg-subtle: oklch(0.560 0.012 245);
    --ed-line:      oklch(0.32  0.020 250);
    --ed-accent:    #E8702A;
  }
  /* ── Light theme — applied via [data-theme=light] OR system pref ── */
  [data-theme="light"] {
    --ed-bg:        oklch(0.985 0.004 240);
    --ed-fg:        oklch(0.16  0.024 250);
    --ed-fg-muted:  oklch(0.36  0.018 245);
    --ed-fg-subtle: oklch(0.55  0.014 245);
    --ed-line:      oklch(0.88  0.008 245);
    --ed-accent:    #E8702A;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ed-bg:        oklch(0.985 0.004 240);
      --ed-fg:        oklch(0.16  0.024 250);
      --ed-fg-muted:  oklch(0.36  0.018 245);
      --ed-fg-subtle: oklch(0.55  0.014 245);
      --ed-line:      oklch(0.88  0.008 245);
      --ed-accent:    #E8702A;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--ed-bg);
    color: var(--ed-fg);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    transition: background 400ms ease, color 400ms ease;
  }
  .serif { font-family: "Instrument Serif", "Cormorant Garamond", Georgia, serif; font-weight: 400; }

  /* ── AnalyzeMyOffer logo — matches Logo.tsx (dark variant, locked) ─── */
  .amo-logo { display: block; overflow: visible; }
  /* transform-box: fill-box pins each element's transform-origin to its own
     bounding box, so `center` is correct for every SVG primitive (rect, circle,
     line) without us needing to know its absolute SVG coordinates. */
  .amo-logo .amo-bg    { transform-box: fill-box; transform-origin: center; opacity: 0; }
  .amo-logo .amo-grid  { opacity: 0; }
  .amo-logo .amo-a,
  .amo-logo .amo-m,
  .amo-logo .amo-trend { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
  .amo-logo .amo-bar   { transform-box: fill-box; transform-origin: center; transform: scaleX(0); }
  .amo-logo .amo-o     { transform-box: fill-box; transform-origin: center; transform: scale(0); opacity: 0; }
  .amo-logo .amo-dot   { transform-box: fill-box; transform-origin: center; transform: scale(0); opacity: 0; }
  .amo-logo .amo-pulse { transform-box: fill-box; transform-origin: center; opacity: 0; }

  /* When the logo is in an active scope (corner on load, or Frame 2 when revealed),
     the entrance choreography fires. */
  .amo-logo.go .amo-bg    { animation: amo-bg-in   0.4s 0.00s cubic-bezier(0.16,1,0.3,1) forwards; }
  .amo-logo.go .amo-grid  { animation: amo-fade-in 0.3s 0.15s ease-out               forwards; }
  .amo-logo.go .amo-a     { animation: amo-draw    0.4s 0.20s ease-out               forwards; }
  .amo-logo.go .amo-bar   { animation: amo-grow-x  0.2s 0.55s ease-out               forwards; }
  .amo-logo.go .amo-m     { animation: amo-draw    0.5s 0.35s ease-out               forwards; }
  .amo-logo.go .amo-o     { animation: amo-pop-in  0.4s 0.60s cubic-bezier(0.16,1,0.3,1) forwards; }
  .amo-logo.go .amo-trend { animation: amo-draw    0.7s 0.90s ease-out               forwards; }
  .amo-logo.go .amo-dot   { animation: amo-spring  0.35s 1.50s ease-out              forwards; }
  .amo-logo.go .amo-pulse { animation: amo-ring 1.2s 1.80s ease-out infinite; animation-delay: 1.8s; }

  @keyframes amo-bg-in   { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes amo-fade-in { to { opacity: 1; } }
  @keyframes amo-draw    { from { stroke-dashoffset: 1; opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
  @keyframes amo-grow-x  { to { transform: scaleX(1); } }
  @keyframes amo-pop-in  { to { transform: scale(1); opacity: 1; } }
  @keyframes amo-spring  {
    0%   { transform: scale(0);   opacity: 0; }
    55%  { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(1);   opacity: 1; }
  }
  @keyframes amo-ring {
    0%   { transform: scale(1);   opacity: 0.6; }
    25%  { transform: scale(3);   opacity: 0; }
    100% { transform: scale(3);   opacity: 0; }
  }

  /* Brand mark — top-left corner */
  .brand-mark {
    position: fixed; top: 1rem; left: 1rem; z-index: 10;
    display: inline-flex; align-items: center; gap: 0.625rem;
    color: var(--ed-fg);
    text-decoration: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .brand-text {
    display: flex; flex-direction: column; line-height: 1;
  }
  .brand-eyebrow {
    font-family: "Inter", system-ui, sans-serif;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ed-fg-subtle);
  }
  .brand-title {
    font-family: "Inter", system-ui, sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
    color: var(--ed-fg);
    margin-top: 2px;
  }
  .brand-title .accent-dot { color: var(--ed-accent); }
  @media (max-width: 480px) { .brand-text { display: none; } }

  /* Footer */
  .site-footer {
    position: fixed; left: 0; right: 0; bottom: 1rem;
    text-align: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ed-fg-subtle);
    pointer-events: none;
    z-index: 10;
  }
  .site-footer .sep { margin: 0 0.5rem; opacity: 0.5; }

  /* Theme toggle — top-right corner */
  .theme-toggle {
    position: fixed; top: 1rem; right: 1rem; z-index: 10;
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    color: var(--ed-fg-muted);
    border: 1px solid var(--ed-line);
    border-radius: 999px;
    cursor: pointer;
    transition: color 200ms ease, border-color 200ms ease, background 200ms ease;
  }
  .theme-toggle:hover { color: var(--ed-accent); border-color: var(--ed-accent); }
  .theme-toggle svg { width: 16px; height: 16px; }
  .theme-toggle .icon-sun  { display: none; }
  .theme-toggle .icon-moon { display: block; }
  [data-theme="light"] .theme-toggle .icon-sun  { display: block; }
  [data-theme="light"] .theme-toggle .icon-moon { display: none; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .theme-toggle .icon-sun  { display: block; }
    :root:not([data-theme="dark"]) .theme-toggle .icon-moon { display: none; }
  }

  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0 1.5rem;
  }

  .frame {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.5rem;
    opacity: 0; pointer-events: none;
    transition: opacity 500ms cubic-bezier(0.4,0,0.2,1),
                transform 500ms cubic-bezier(0.4,0,0.2,1);
  }
  .frame.in  { opacity: 1; }
  .frame.out { opacity: 0; transform: translateY(-10px) scale(0.98); }

  .f0 .line {
    font-size: clamp(48px, 7vw, 96px);
    line-height: 1.02;
    letter-spacing: -0.03em;
    color: var(--ed-fg-muted);
    text-align: center;
  }
  .f0 .accent { color: var(--ed-accent); font-style: italic; }

  .f1 .line {
    font-size: clamp(64px, 10vw, 160px);
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: var(--ed-fg);
    text-align: center;
  }
  .f1 .word { color: var(--ed-accent); font-style: italic; display: inline-block; }
  .f1 .dot {
    display: inline-block; color: var(--ed-fg);
    opacity: 0; transform: translateY(-80px) scale(0.4);
    transition: transform 450ms cubic-bezier(0.34,1.4,0.64,1),
                opacity 450ms cubic-bezier(0.34,1.4,0.64,1);
  }
  .f1 .dot.land { opacity: 1; transform: translateY(0) scale(1); }
  .f1 .subline {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(11px, 1vw, 12px);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ed-fg-subtle);
    text-align: center;
    opacity: 0; transform: translateY(8px);
    transition: opacity 600ms cubic-bezier(0.4,0,0.2,1),
                transform 600ms cubic-bezier(0.4,0,0.2,1);
  }
  .f1 .subline.show { opacity: 1; transform: translateY(0); }
  .f1 .underline { position: relative; display: inline-block; }
  .f1 .underline::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: -2px;
    height: 1.5px; background: var(--ed-accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform 500ms cubic-bezier(0.4,0,0.2,1);
  }
  .f1 .underline.draw::after { transform: scaleX(1); }

  .f2 .row {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 0.75rem;
  }
  @media (min-width: 640px) { .f2 .row { flex-direction: row; gap: 1.5rem; } }
  .f2 .logo-large { display: inline-block; line-height: 0; }
  .f2 .wordmark {
    font-family: "Instrument Serif", serif;
    font-size: clamp(32px, 5.4vw, 64px);
    line-height: 1.02;
    letter-spacing: -0.025em;
    color: var(--ed-fg);
    margin: 0;
  }
  .f2 .wordmark em { color: var(--ed-accent); font-style: italic; }

  .f3 { transition: opacity 800ms cubic-bezier(0.4,0,0.2,1); }
  .f3 .coming {
    font-family: "Instrument Serif", serif;
    font-size: clamp(72px, 14vw, 220px);
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: var(--ed-accent);
    font-style: italic;
    text-align: center;
    margin: 0;
    animation: breathe 3.6s cubic-bezier(0.4,0,0.2,1) infinite;
  }
  .f3 .tag {
    margin-top: 1.5rem;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--ed-fg-subtle);
    text-align: center;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.015); }
  }

  .caret {
    display: inline-block; width: 0.5ch;
    color: var(--ed-accent);
    opacity: 0.6;
    animation: blink 800ms steps(2, jump-none) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark / light mode">

    </svg>
  </button>

  <script>
    /* ── Theme persistence ────────────────────────────────────────── */
    (function () {
      const KEY = "amo_theme";
      const root = document.documentElement;
      const saved = (() => { try { return localStorage.getItem(KEY); } catch { return null; } })();
      if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);

      document.getElementById("theme-toggle").addEventListener("click", () => {
        const current = root.getAttribute("data-theme");
        let next;
        if (current === "light") next = "dark";
        else if (current === "dark") next = "light";
        else {
          // No explicit setting — flip relative to system
          const systemLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          next = systemLight ? "dark" : "light";
        }
        root.setAttribute("data-theme", next);
        try { localStorage.setItem(KEY, next); } catch {}
      });
    })();

    /* ── Story intro ─────────────────────────────────────────────── */
    (function () {
      const frames = [0,1,2,3].map(i => document.getElementById("frame-" + i));
      const show = (idx) => {
        frames.forEach((el, i) => {
          el.classList.remove("in","out");
          if (i === idx) el.classList.add("in");
          else if (i < idx) el.classList.add("out");
        });
      };
      const type = (el, text, speed) => new Promise(resolve => {
        let i = 0;
        const id = setInterval(() => {
          i += 1;
          el.textContent = text.slice(0, i);
          if (i >= text.length) { clearInterval(id); resolve(); }
        }, speed);
      });
      const wait = (ms) => new Promise(r => setTimeout(r, ms));

      async function run() {
        // Frame 0 — "Don't guess."
        show(0);
        const f0 = document.getElementById("f0-text");
        const f0caret = document.getElementById("f0-caret");
        await type(f0, "Don’t ", 110);
        const accent = document.createElement("em");
        accent.className = "accent";
        f0.appendChild(accent);
        await type(accent, "guess", 110);
        f0.appendChild(document.createTextNode("."));
        f0caret.style.display = "none";
        await wait(800);

        // Frame 1 — "Know." + subline + underline draw
        show(1);
        const f1word = document.getElementById("f1-word");
        const f1caret = document.getElementById("f1-caret");
        const f1dot = document.getElementById("f1-dot");
        const f1sub = document.getElementById("f1-subline");
        const f1under = document.getElementById("f1-underline");
        await type(f1word, "Know", 130);
        f1caret.style.display = "none";
        requestAnimationFrame(() => f1dot.classList.add("land"));
        await wait(700);
        f1sub.classList.add("show");
        await wait(800);
        f1under.classList.add("draw");

        // Hold Frame 1 for a beat — let "Know. Negotiate. Or sign with clarity." land.
        await wait(2800);

        // Frame 2 — Logo + wordmark. Trigger the SVG's entrance choreography.
        show(2);
        document.getElementById("amo-logo-large").classList.add("go");
        // Logo entrance lasts ~1.85s (last animation: dot @ 1.5s + 0.35s).
        // Hold a touch beyond it so the pulsing ring breathes once before exit.
        await wait(3200);

        // Frame 3 — Coming Soon (held)
        show(3);
      }

      window.requestAnimationFrame(() => setTimeout(run, 150));
    })();
  </script>
</body>
